[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offloader"
version = "0.1.0"
description = "Verified copy for large data transfers, with camera-card offload, ShotPut Pro-compatible reports, ASC MHL, and Blackmagic RAW support"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Owen Kent", email = "Owenpkent@gmail.com" }]
keywords = [
    "offload", "checksum", "verification", "mhl", "ascmhl", "dit",
    "camera-original", "braw", "blackmagic-raw", "media", "post-production",
    "data-integrity", "xxhash", "c4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: System :: Archiving :: Mirroring",
    "Topic :: Utilities",
]
dependencies = [
    "xxhash>=3.4",
    "reportlab>=4.0",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=5.0",
    "pymupdf>=1.24",
    "hypothesis>=6.100",
    "ruff>=0.4",
    "PySide6>=6.6",
]

[project.urls]
Homepage = "https://github.com/owenpkent/offloader"
Repository = "https://github.com/owenpkent/offloader"
Issues = "https://github.com/owenpkent/offloader/issues"
Changelog = "https://github.com/owenpkent/offloader/blob/main/CHANGELOG.md"
Documentation = "https://github.com/owenpkent/offloader#documentation"

[project.scripts]
offloader = "offloader.cli:main"

[project.gui-scripts]
offloader-gui = "offloader.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Qt runs headless because each GUI test module sets QT_QPA_PLATFORM before
# importing PySide6; CI sets it too.
# A SyntaxWarning is almost always a broken escape in a docstring or regex,
# which has bitten this codebase more than once. Make it fatal.
filterwarnings = ["error::SyntaxWarning"]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# F: pyflakes (unused imports, undefined names)
# E9: syntax and IO errors
# I: import order
# B: likely bugs (bugbear)
# UP: outdated syntax for the target version
select = ["F", "E9", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose, and import after setting
# QT_QPA_PLATFORM.
"tests/*" = ["E402"]
# Qt's model API is defined with QModelIndex() defaults; matching the framework
# signature matters more here than the general rule against call-in-default.
"src/offloader/gui/queue_view.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["offloader"]

[tool.coverage.run]
source = ["offloader"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
