# Tag-triggered release candidate preparation.
#
# What this does NOT do is publish a download. Signing needs the OK Studio
# hardware token, which is only exposed to an interactive session on the
# release workstation, and docs/release-plan.md is explicit that unsigned CI
# output is a development artifact and must never be promoted to a release
# asset. So this workflow does everything that does not require the key:
# it gates the tag against the declared version, proves the candidate builds
# and that the frozen executables carry the right version, publishes the
# unsigned bundle as a workflow artifact for inspection, and prepares a draft
# release pinned to the tagged commit for the signed installer to be attached
# to. See docs/build-windows.md for the signing and upload steps.
name: Release candidate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rehearse the checks against, e.g. v0.1.0b1"
        required: true

# Read-only by default; the one job that needs to write says so itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Gate the tag and build the candidate
    runs-on: windows-latest
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate reads the working tree, so it has to be the
          # tagged commit rather than a branch tip that has moved since.
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging dependencies
        run: python -m pip install -e ".[gui]" -r requirements-build.txt

      - name: Refuse a tag that disagrees with the declared version
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_tag.py "${{ github.event.inputs.tag || github.ref }}"
          python -c "import sys; sys.path.insert(0, 'src'); from offloader._version import __version__; print('version=' + __version__)" >> "$GITHUB_OUTPUT"

      - name: Install NSIS
        run: choco install nsis --version=3.12.0 -y --no-progress

      - name: Build the unsigned candidate
        run: python build/windows/build.py --clean --no-sign

      - name: Confirm the artifacts the release contract names
        shell: bash
        run: |
          version="${{ steps.identity.outputs.version }}"
          cd dist/windows
          for name in "Offloader-Setup-${version}.exe" \
                      "Offloader-${version}-windows-x64.zip" \
                      "Offloader-${version}-inventory.json" \
                      "Offloader-${version}-sbom.cyclonedx.json" \
                      "Offloader-${version}-third-party-notices.txt" \
                      "Offloader-${version}-requirements.txt" \
                      "SHA256SUMS.txt"; do
            test -f "$name" || { echo "missing artifact: $name"; exit 1; }
          done
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: offloader-candidate-${{ steps.identity.outputs.version }}-unsigned
          path: |
            dist/windows/Offloader-*.exe
            dist/windows/Offloader-*.zip
            dist/windows/Offloader-*-inventory.json
            dist/windows/Offloader-*-sbom.cyclonedx.json
            dist/windows/Offloader-*-third-party-notices.txt
            dist/windows/Offloader-*-requirements.txt
            dist/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Prepare the draft release
    needs: candidate
    # Only on a real tag: a dispatch run is a rehearsal of the checks and
    # should not touch releases.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create or refresh the draft, without assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/release_notes.py --tag "$TAG" --commit "$GITHUB_SHA" \
            --out release-notes.md
          # Refreshed rather than replaced: re-running a tag must not discard
          # a signed asset already uploaded against it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "Offloader $VERSION" \
              --notes-file release-notes.md
          else
            gh release create "$TAG" --draft --prerelease \
              --title "Offloader $VERSION" --notes-file release-notes.md \
              --target "$GITHUB_SHA"
          fi
          echo "Draft prepared for $TAG with no assets; upload the signed installer."
